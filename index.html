<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Haruka Profile</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0f7, #e0f7ff);
    }

    .profile-img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 20px;
}

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 380px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);

      margin: 60px auto; 
    }

    h1 {
      margin-bottom: 5px;
    }

    .basic-info {
      margin-bottom: 20px;
      color: #555;
    }

    .section {
      margin-top: 20px;
      text-align: left;
    }

    .section h3 {
      margin-bottom: 5px;
      border-bottom: 2px solid #eee;
      padding-bottom: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: #ff7bd5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.skill-tag {
  background: #ffe6fa;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
}

.social-links {
  margin-top: 15px;
}

.social-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 50px;
  height: 50px;

  margin: 0 10px;
  background-color: #ff8fab;
  color: white;

  border-radius: 50%;
  text-decoration: none;
  font-size: 22px;

  transition: 0.3s;

  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.social-links a:hover {
  transform: scale(1.1);
  background-color: #ff5c8a;
}

.contest-section {
  margin-top: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.contest-card {
  background-color: white;
  padding: 25px;
  margin: 20px 0;
  width: 85%;
  max-width: 400px;
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.contest-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 18px;
  background-color: #ff8fab;
  color: white;
  text-decoration: none;
  border-radius: 25px;
  transition: 0.3s;
}

.contest-btn:hover {
  background-color: #ff5c8a;
  transform: scale(1.05);
}

  </style>
</head>

<body>

  <div class="card">
    <img src="images/profile.jpg" alt="プロフィール写真" class="profile-img">
    <h1>佐藤　陽実</h1>

    <div class="basic-info">
      <div>北海学園大学</div>
      <div>経営学部</div>
      <div>大学2年生</div>

      <div class="social-links">
        <a href="https://instagram.com/_m__123o" target="_blank">
          <i class="fa-brands fa-instagram"></i>
        </a>
      
        <a href="https://github.com/harumi-dev" target="_blank">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>

      
      
        
            <h2>Business Contest</h2>
          
            <div class="contest-card">
              <h3>LLP北海道 2025</h3>
              <p>HMCCが主催する「LLP」のDemoDayが開催されました！</p>
              <a href="https://www.hmcc.jp/2025/09/30/hmcc_llp_demoday/" target="_blank" class="contest-btn">
                詳細を見る
              </a>
            </div>
          
            <div class="contest-card">
              <h3>北海道起業家甲子園 2025</h3>
              <p>「北海道起業家甲子園2025」に出場しました！</p>
              <a href="https://www.soumu.go.jp/soutsu/hokkaido/C/u-Land/20251217.html" target="_blank" class="contest-btn">
                詳細を見る
              </a>
            </div>
          
          </div>
      </div>

    </div>

    <div class="section">
      <h3>About Me</h3>
      <p>在学中にサービスをリリースすることが目標です！
        現在はProcessNoteというサービスの開発をメインに行なっています。
      </p>
    </div>

    <div class="section">
        <h3>Skills</h3>
      
        <div class="skills">
          <span class="skill-tag">HTML</span>
          <span class="skill-tag">CSS</span>
          <span class="skill-tag">JavaScript</span>
        </div>
      </div>

    <button onclick="addMessage()">応援する</button>
    <p id="message"></p>


  </div>
<script>
  function addMessage() {
    document.getElementById("message").innerText =
      "開発頑張ります！🔥";
  }
</script>

</body>
</html>
